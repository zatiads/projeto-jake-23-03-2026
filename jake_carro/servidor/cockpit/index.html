<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Jake · cockpit</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600&family=Inter+Tight:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{
  --fundo:#04070D; --navy:#0B1A2B; --ciano:#22D3EE; --gelo:#F2FBFF; --texto:#E6F1F8; --suave:#8FB3C6; --apagado:#86A9BC;
  --cor:#22D3EE; --halo:rgba(34,211,238,.35);
  --tec:'Chakra Petch','Eurostile',system-ui,sans-serif; --corpo:'Inter Tight',system-ui,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;background:var(--fundo);overflow:hidden}
#janela{position:fixed;top:0;right:0;bottom:0;left:0;display:flex;align-items:center;justify-content:center}
#palco{position:relative;width:1024px;height:600px;overflow:hidden;transform-origin:center;
  background:radial-gradient(120% 95% at 50% 62%,#0B1A2B 0%,#060C16 46%,#03060B 100%);
  font-family:var(--corpo);color:var(--texto)}

/* ── abertura ── */
#palco.acordando .some{opacity:0;transform:translateY(8px)}
.some{transition:opacity .9s ease,transform .9s ease}
#flash{position:absolute;left:50%;top:58%;width:10px;height:10px;margin:-5px;border-radius:50%;
  background:var(--ciano);box-shadow:0 0 60px 30px rgba(34,211,238,.6);opacity:0;pointer-events:none}
#palco.acordando #flash{animation:flash 1.6s ease-out forwards}
@keyframes flash{0%{opacity:0;transform:scale(.2)}25%{opacity:1}100%{opacity:0;transform:scale(90)}}

/* ── piso e estrada ── */
#piso{position:absolute;left:-10%;right:-10%;bottom:-40px;height:300px;
  background-image:linear-gradient(rgba(34,211,238,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(34,211,238,.07) 1px,transparent 1px);
  background-size:56px 56px;transform:perspective(520px) rotateX(64deg);transform-origin:bottom;opacity:.7;transition:opacity .8s}
#estrada{position:absolute;top:0;right:0;bottom:0;left:0;opacity:0;transition:opacity .8s;pointer-events:none}
.andando #estrada{opacity:1}
.andando #piso{opacity:0}

/* ── barra de cima ── */
#topo{position:absolute;top:0;left:0;right:0;height:78px;padding:0 30px;display:flex;align-items:center;justify-content:space-between}
#marca{height:30px;opacity:.95}
#hora{position:absolute;left:50%;top:14px;transform:translateX(-50%);text-align:center}
#hora .h{font-family:var(--tec);font-weight:500;font-size:44px;line-height:1;color:var(--gelo);letter-spacing:1px;font-variant-numeric:tabular-nums}
#hora .d{font-size:14px;color:var(--suave);margin-top:4px}
.andando #hora .h{font-size:30px}.andando #hora .d{display:none}
#status{display:flex;align-items:center;gap:18px;font-family:var(--tec);font-size:17px;color:var(--suave)}
#status .sep{width:1px;height:22px;background:rgba(143,179,198,.3)}
#rede{display:flex;align-items:flex-end;gap:2px;height:14px}
#rede i{display:block;width:3px;background:var(--suave);border-radius:1px}
#rede.off i{background:#FBBF24;opacity:.6}
#status b{color:var(--gelo);font-weight:500}
.linha-topo{position:absolute;left:30px;right:30px;top:86px;height:1px;
  background:linear-gradient(90deg,transparent,rgba(34,211,238,.18) 30%,rgba(34,211,238,.6) 50%,rgba(34,211,238,.18) 70%,transparent);opacity:0;transition:opacity .6s}
.parado .linha-topo{opacity:.55}
.andando .linha-topo{opacity:1}

/* ── modos ── */
.so-parado,.so-andando{transition:opacity .7s ease,transform .7s ease}
.andando .so-parado{opacity:0;pointer-events:none;transform:translateY(10px)}
.parado .so-andando{opacity:0;pointer-events:none;transform:translateY(10px)}

/* parado: laterais */
.rotulo{font-family:var(--tec);font-size:24px;letter-spacing:2.5px;color:var(--gelo);font-weight:500;text-transform:uppercase}
.traco{height:2px;width:100%;margin:12px 0 14px;background:linear-gradient(90deg,var(--ciano),rgba(34,211,238,0))}
#esq{position:absolute;left:30px;top:120px;width:236px}
#esq .rotulo{font-size:19px;letter-spacing:2px;white-space:nowrap}
.sub{font-family:var(--tec);font-size:13px;letter-spacing:3px;color:var(--ciano);margin:26px 0 4px}
#clima{font-size:15px;color:var(--suave);line-height:1.6}
#clima b{color:var(--texto);font-weight:500}
#dir{position:absolute;right:30px;top:104px;width:236px;display:flex;flex-direction:column;gap:12px}
.cartao{position:relative;border-radius:16px;overflow:hidden;border:1px solid rgba(34,211,238,.32);background:rgba(8,20,34,.78);
  box-shadow:0 0 18px rgba(34,211,238,.12)}
.cartao::before{content:"";position:absolute;left:14%;right:14%;top:0;height:1px;z-index:600;pointer-events:none;
  background:linear-gradient(90deg,transparent,#7DE9F7,transparent);box-shadow:0 0 8px #22D3EE}
#mapa-card{height:200px;cursor:pointer}
#mapa{position:absolute;top:0;right:0;bottom:0;left:0;background:#06101c}
#mapa .leaflet-tile{filter:brightness(1.35) sepia(1) hue-rotate(150deg) saturate(2.2) brightness(.5) contrast(1.25)}
#mapa .leaflet-control-attribution{background:rgba(4,7,13,.6);color:#5F8497;font-size:8px;padding:0 4px}
#mapa .leaflet-control-attribution a{color:#5F8497}
#mapa-rotulo{position:absolute;left:12px;top:10px;z-index:500;font-family:var(--tec);font-size:12px;letter-spacing:3px;color:var(--ciano);
  text-shadow:0 0 8px #04070D,0 0 3px #04070D;pointer-events:none}
#mapa-info{position:absolute;left:0;right:0;bottom:0;z-index:500;padding:18px 12px 9px;font-size:13px;color:var(--gelo);
  background:linear-gradient(0deg,rgba(4,7,13,.92),rgba(4,7,13,0));pointer-events:none}
.eu{width:16px;height:16px;border-radius:50%;background:var(--ciano);border:2px solid #fff;box-shadow:0 0 0 6px rgba(34,211,238,.25),0 0 14px var(--ciano)}
#musica-card{height:92px;display:flex;align-items:center;gap:12px;padding:0 12px}
#capa{width:62px;height:62px;border-radius:10px;flex:none;background:#0d2236 center/cover no-repeat;display:flex;align-items:center;justify-content:center;color:var(--ciano)}
#musica-dir{flex:1;min-width:0;display:flex;flex-direction:column}
#musica-txt{min-width:0;cursor:pointer}
#musica-tit{font-size:15px;color:var(--gelo);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#musica-art{font-size:12px;color:var(--suave);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.ctl{display:flex;gap:6px;margin-top:2px}
.ctl button{width:44px;height:36px;border:none;background:none;color:var(--texto);display:flex;align-items:center;justify-content:center;padding:0;cursor:pointer}
.ctl button.play{color:var(--ciano)}
#agenda .item{display:flex;gap:16px;align-items:baseline;padding:9px 0;border-bottom:1px solid rgba(143,179,198,.14)}
#agenda .item:last-child{border-bottom:none}
#agenda .hh{font-family:var(--tec);font-size:17px;color:var(--ciano);min-width:66px}
#agenda .hh.dia{font-family:var(--corpo);font-size:13px;color:var(--suave)}
#agenda .tt{font-size:16px;color:var(--gelo)}
#agenda .vazio{font-size:15px;color:var(--suave)}

/* carro girando */
#carro{position:absolute;left:268px;top:104px;width:488px;height:325px;touch-action:none;cursor:grab}
#giro,#giro2,.refl,#foto{position:absolute;left:-30px;top:6px;width:548px;height:288px;background-repeat:no-repeat}
#foto{pointer-events:none;transition:opacity .25s;
  filter:drop-shadow(0 0 1px rgba(125,233,247,.6)) drop-shadow(0 0 12px rgba(34,211,238,.22))}
.refl{left:0;top:0}
#reflexo{position:absolute;left:-30px;top:224px;width:548px;height:288px;transform:scaleY(-1);opacity:.22;pointer-events:none;
  -webkit-mask-image:linear-gradient(0deg,#000 0%,transparent 26%);mask-image:linear-gradient(0deg,#000 0%,transparent 26%)}
#luz-estudio{position:absolute;left:-40px;right:-40px;top:20px;height:290px;border-radius:50%;pointer-events:none;
  background:radial-gradient(closest-side,rgba(34,211,238,.20),rgba(14,90,140,.10) 55%,transparent)}

/* WebView antigo sem "gap" no flex: margens no lugar */
.semgap .doca>*+*{margin-left:18px}
.semgap #dir>*+*{margin-top:12px}
.semgap .ctl>*+*{margin-left:6px}
.semgap #status>*+*{margin-left:18px}
.semgap .atalho>*+*{margin-top:7px}
.semgap #onda .lado>*+*{margin-left:3px}
.semgap.andando #jake>*+*{margin-left:14px}
.semgap #velo .linha>*+*{margin-left:10px}
.semgap #barra>*+*{margin-left:3px}
.semgap #manobra>*+*{margin-left:14px}

/* modo noite: menos brilho pra não ofuscar na estrada */
#pelicula{position:absolute;top:0;right:0;bottom:0;left:0;background:#000;opacity:0;pointer-events:none;transition:opacity 2s;z-index:50}
.noite #pelicula{opacity:.22}
.noite #horizonte{box-shadow:0 0 6px 1px rgba(34,211,238,.45)}
.noite #horizonte-brilho,.noite #luz-estudio{opacity:.5}
.noite .cartao,.noite .atalho .bola{box-shadow:none}

/* faixa neon do "estúdio": atravessa a tela na altura do chão do carro */
#horizonte{position:absolute;left:0;right:0;top:372px;height:2px;pointer-events:none;
  background:linear-gradient(90deg,transparent 0%,rgba(34,211,238,.35) 12%,#22D3EE 38%,#7DE9F7 50%,#22D3EE 62%,rgba(34,211,238,.35) 88%,transparent 100%);
  box-shadow:0 0 10px 1px rgba(34,211,238,.7),0 0 34px 4px rgba(34,211,238,.28)}
#horizonte-brilho{position:absolute;left:0;right:0;top:300px;height:150px;pointer-events:none;
  background:radial-gradient(50% 50% at 50% 50%,rgba(34,211,238,.13),transparent 70%)}
.andando #horizonte,.andando #horizonte-brilho{opacity:0}
#horizonte,#horizonte-brilho{transition:opacity .7s}
#anel{position:absolute;left:66px;right:66px;top:233px;height:50px;border-radius:50%;border:2px solid rgba(34,211,238,.75);
  box-shadow:0 0 22px rgba(34,211,238,.45),inset 0 0 22px rgba(34,211,238,.25);pointer-events:none}
#dica{position:absolute;left:0;right:0;top:4px;text-align:center;font-family:var(--tec);font-size:11px;letter-spacing:4px;color:var(--apagado);transition:opacity 1s}

/* doca de atalhos (launcher) */
.doca{position:absolute;bottom:26px;display:flex;gap:18px}
#doca-e{left:30px}#doca-d{right:30px}
.atalho{display:flex;flex-direction:column;align-items:center;gap:7px;background:none;border:none;padding:0;cursor:pointer;font-family:var(--corpo)}
.atalho .bola{width:60px;height:60px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  border:1px solid rgba(34,211,238,.5);background:rgba(8,20,34,.6);color:var(--ciano);
  box-shadow:0 0 16px rgba(34,211,238,.16),inset 0 0 12px rgba(34,211,238,.08);transition:transform .15s,background .15s}
.atalho:active .bola{transform:scale(.93);background:rgba(34,211,238,.18)}
.atalho span{font-size:13px;color:var(--suave);letter-spacing:.3px}
/* andando: velocidade + computador de bordo à esquerda, carro 3/4 traseiro na estrada, curva no alto, mapa ao vivo à direita */
#velo{position:absolute;left:30px;top:104px;width:250px}
#velo .lbl,#viagem .lbl{font-family:var(--tec);font-size:12px;letter-spacing:3px;color:var(--ciano);text-transform:uppercase}
#velo .linha{display:flex;align-items:baseline;gap:10px;margin-top:2px}
#velo .n{font-family:var(--tec);font-weight:500;font-size:104px;line-height:1;color:var(--gelo);font-variant-numeric:tabular-nums}
#velo .u{font-size:20px;color:var(--suave)}
#barra{display:flex;gap:3px;height:16px;margin-top:12px}
#barra i{flex:1;border-radius:2px;background:rgba(143,179,198,.14);transition:background .25s,box-shadow .25s}
#barra i.on{background:var(--ciano);box-shadow:0 0 8px rgba(34,211,238,.6)}
#barra i.on.alta{background:#FBBF24;box-shadow:0 0 8px rgba(251,191,36,.6)}
#barra-escala{display:flex;justify-content:space-between;font-family:var(--tec);font-size:11px;color:var(--apagado);margin-top:4px}
#viagem{position:absolute;left:30px;top:322px;width:250px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px 14px}
#viagem .v{font-family:var(--tec);font-size:26px;color:var(--gelo);margin-top:2px;font-variant-numeric:tabular-nums}
#viagem .v small{font-size:13px;color:var(--suave);margin-left:3px}
#tras{position:absolute;left:286px;top:206px;width:452px;height:238px;background:url(carro_tras34.webp) center bottom/contain no-repeat;
  filter:drop-shadow(0 0 1px rgba(125,233,247,.6)) drop-shadow(0 0 14px rgba(34,211,238,.22))}
#rota{position:absolute;left:300px;top:100px;width:424px;text-align:center}
#manobra{display:none;align-items:center;justify-content:center;gap:14px}
#rota.nav #manobra{display:flex}
#seta{width:64px;height:64px;flex:none;color:var(--ciano);filter:drop-shadow(0 0 8px rgba(34,211,238,.6))}
#dist{font-family:var(--tec);font-size:38px;line-height:1;color:var(--gelo);font-variant-numeric:tabular-nums;text-align:left}
#instr{font-size:16px;color:var(--texto);margin-top:4px;line-height:1.25;text-align:left;max-width:300px}
#rota .dest{font-size:15px;color:var(--suave);margin-top:8px}
#rota .dest b{color:var(--gelo);font-weight:500}
.andando #mapa-card{height:300px}
.andando #dir{top:100px}

/* ── Jake ── */
#jake{position:absolute;left:50%;bottom:22px;z-index:2;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;transition:all .7s ease}
.andando #jake{bottom:16px;flex-direction:row;gap:14px}
#orbe{position:relative;width:96px;height:96px;cursor:pointer}
.andando #orbe{width:76px;height:76px}
#orbe .halo{position:absolute;top:-20px;right:-20px;bottom:-20px;left:-20px;border-radius:50%;background:radial-gradient(closest-side,var(--halo),transparent);transition:background .5s}
#orbe .nucleo{position:absolute;top:18%;right:18%;bottom:18%;left:18%;border-radius:50%;
  background:radial-gradient(circle at 36% 30%,#fff 0%,var(--cor) 30%,rgba(4,7,13,.95) 78%);
  box-shadow:0 0 26px var(--cor),inset 0 0 18px rgba(255,255,255,.25);transition:box-shadow .5s,background .5s}
#orbe .aro{position:absolute;top:6%;right:6%;bottom:6%;left:6%;border-radius:50%;border:1.5px solid var(--cor);opacity:.7;transform:rotateX(68deg) rotateZ(0deg);animation:gira 6s linear infinite}
#orbe .aro.b{top:0;right:0;bottom:0;left:0;opacity:.45;animation-duration:9s;animation-direction:reverse;transform:rotateY(64deg)}
#orbe .meridiano{position:absolute;top:18%;right:18%;bottom:18%;left:18%;border-radius:50%;border:1px solid rgba(255,255,255,.35);transform:rotateY(60deg);animation:gira2 7s linear infinite}
@keyframes gira{to{transform:rotateX(68deg) rotateZ(360deg)}}
@keyframes gira2{to{transform:rotateY(60deg) rotateZ(360deg)}}
#orbe.pulsa .nucleo{animation:pulsa 2.4s ease-in-out infinite}
@keyframes pulsa{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
#onda{position:absolute;top:44px;left:50%;width:620px;margin-left:-310px;height:20px;display:flex;align-items:center;justify-content:space-between;pointer-events:none}
#onda .lado{display:flex;align-items:center;gap:3px;width:230px;justify-content:flex-end}
#onda .lado.d{justify-content:flex-start}
#onda i{display:block;width:2px;border-radius:1px;background:var(--cor);opacity:.75;height:3px;transition:height .08s}
.andando #onda{display:none}
#legenda{text-align:center;margin-top:12px}
.andando #legenda{text-align:left;margin-top:0}
#estado{font-family:var(--tec);font-size:20px;color:var(--cor);letter-spacing:1px;transition:color .5s}
#frase{font-size:19px;color:var(--gelo);margin-top:8px;max-width:620px;min-height:26px;line-height:1.3}
.andando #frase{font-size:15px;max-width:260px;margin-top:2px;color:var(--suave)}
</style>
</head>
<body>
<div id="janela">
<div id="palco" class="parado acordando">
  <div id="piso"></div>
  <div id="horizonte-brilho"></div>
  <div id="horizonte"></div>
  <canvas id="estrada" width="1024" height="600"></canvas>
  <div id="flash"></div>
  <div id="pelicula"></div>

  <div id="topo" class="some">
    <img id="marca" src="marca.png" alt="Hyundai HB20">
    <div id="hora"><div class="h" id="relogio">--:--</div><div class="d" id="data"></div></div>
    <div id="status">
      <span style="display:flex;align-items:center;gap:8px">4G <span id="rede"><i style="height:4px"></i><i style="height:7px"></i><i style="height:10px"></i><i style="height:14px"></i></span></span>
      <span class="sep"></span>
      <span><b id="temp-topo">--°</b> <span id="cidade-topo">Varginha</span></span>
    </div>
  </div>
  <div class="linha-topo"></div>

  <!-- PARADO -->
  <div id="esq" class="so-parado some">
    <div class="rotulo" id="saudacao">Olá, patrão</div>
    <div class="traco"></div>
    <div id="clima">Carregando o tempo…</div>
    <div class="sub">HOJE</div>
    <div id="agenda"><div class="vazio">Carregando a agenda…</div></div>
  </div>
  <div id="dir" class="some">
    <div id="mapa-card" class="cartao" role="button" aria-label="Abrir o Google Maps">
      <div id="mapa"></div>
      <div id="mapa-rotulo">MAPA</div>
      <div id="mapa-info">Você está aqui</div>
    </div>
    <div id="musica-card" class="cartao">
      <div id="capa"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18V5l11-2v13"/><circle cx="6.5" cy="18" r="2.5"/><circle cx="17.5" cy="16" r="2.5"/></svg></div>
      <div id="musica-dir">
      <div id="musica-txt" role="button" aria-label="Abrir o Spotify"><div id="musica-tit">Nada tocando</div><div id="musica-art">Toque pra abrir o Spotify</div></div>
      <div class="ctl">
        <button data-midia="anterior" aria-label="Música anterior"><svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7 6h2v12H7zM10 12l9-6v12z"/></svg></button>
        <button data-midia="alternar" class="play" aria-label="Tocar ou pausar"><svg id="icone-play" width="22" height="22" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg></button>
        <button data-midia="proxima" aria-label="Próxima música"><svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M15 6h2v12h-2zM5 6l9 6-9 6z"/></svg></button>
      </div>
      </div>
    </div>
  </div>
  <div id="carro" class="so-parado">
    <div id="luz-estudio"></div>
    <div id="anel"></div>
    <div id="reflexo"><div class="refl" id="refl1"></div><div class="refl" id="refl2"></div></div>
    <div id="giro" role="img" aria-label="Seu HB20 — arraste para girar"></div>
    <div id="giro2" aria-hidden="true"></div>
    <img id="foto" src="carro_pose.webp" alt="" aria-hidden="true">
    <div id="dica">ARRASTE · 360°</div>
  </div>
  <div id="doca-e" class="doca so-parado some">
    <button class="atalho" id="p-viagem" aria-label="Modo viagem"><span class="bola"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M6 21 10 3M18 21 14 3M12 6v2M12 11v2M12 16v2"/></svg></span><span>Viagem</span></button>
    <button class="atalho" id="p-resumo" aria-label="Resumo do dia"><span class="bola"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M9 8h6M9 12h6M9 16l2 2 4-4"/></svg></span><span>Resumo</span></button>
  </div>
  <div id="doca-d" class="doca so-parado some">
    <button class="atalho" data-app="apps" aria-label="Todos os apps"><span class="bola"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><rect x="4" y="4" width="6" height="6" rx="1.5"/><rect x="14" y="4" width="6" height="6" rx="1.5"/><rect x="4" y="14" width="6" height="6" rx="1.5"/><rect x="14" y="14" width="6" height="6" rx="1.5"/></svg></span><span>Apps</span></button>
  </div>

  <!-- ANDANDO -->

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="tempo_real.js"></script>
<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const palco = $('palco');
  const nativo = window.Android || null;          // ponte com o app (Kotlin)
  const params = new URLSearchParams(location.search);

  // ── diagnóstico: manda erros e dados do aparelho pro servidor (o Bruno não precisa descrever) ──
  const tokenDiag = () => (window.Android && Android.token ? Android.token() : params.get('t') || '');
  const vistos = {};
  window.diag = function (tipo, msg, detalhe) {
    const chave = tipo + msg;
    if (vistos[chave] && Date.now() - vistos[chave] < 60000) return;   // o mesmo erro no máximo 1x/min
    vistos[chave] = Date.now();
    try {
      fetch('/carro/diag', { method: 'POST',
        headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + tokenDiag() },
        body: JSON.stringify({ tipo, msg: String(msg).slice(0, 500), detalhe: detalhe || {} }) }).catch(() => {});
    } catch (e) {}
  };
  addEventListener('error', (e) => diag('erro-js', e.message, { arquivo: e.filename, linha: e.lineno }));
  addEventListener('unhandledrejection', (e) => diag('erro-promessa', (e.reason && e.reason.message) || String(e.reason)));
  const conexao = navigator.connection || {};
  diag('inicio', window.Android ? 'cockpit abriu no app' : 'cockpit abriu no navegador', {
    agente: navigator.userAgent, tela: `${screen.width}x${screen.height}`, janela: `${innerWidth}x${innerHeight}`,
    densidade: devicePixelRatio, memoriaGB: navigator.deviceMemory || null, nucleos: navigator.hardwareConcurrency || null,
    rede: conexao.effectiveType || null, online: navigator.onLine,
    webrtc: !!window.RTCPeerConnection, microfone: !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia) });

  // ── WebView antigo (centrais com Android antigo) não tem "gap" no flex: liga o plano B ──
  (function () {
    const t = document.createElement('div');
    t.style.cssText = 'display:flex;flex-direction:column;gap:1px;position:absolute';
    t.appendChild(document.createElement('div')); t.appendChild(document.createElement('div'));
    document.body.appendChild(t);
    if (t.scrollHeight !== 1) palco.classList.add('semgap');
    t.remove();
  })();

  // ── guarda o cockpit na central pra abrir mesmo sem internet ──
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js', { scope: './' }).catch(() => {});

  // ── encaixa o palco 1024×600 em qualquer tela ──
  function encaixar() {
    const e = Math.min(innerWidth / 1024, innerHeight / 600);
    palco.style.transform = `scale(${e})`;
  }
  addEventListener('resize', encaixar); encaixar();
  if (params.get('semabertura')) { document.querySelectorAll('.some,.so-parado,.so-andando').forEach((e) => { e.style.transition = 'none'; }); palco.classList.remove('acordando'); }
  else setTimeout(() => palco.classList.remove('acordando'), 350);

  // ── relógio ──
  const dias = ['dom', 'seg', 'ter', 'qua', 'qui', 'sex', 'sáb'];
  const meses = ['jan', 'fev', 'mar', 'abr', 'mai', 'jun', 'jul', 'ago', 'set', 'out', 'nov', 'dez'];
  function tic() {
    const d = new Date();
    $('relogio').textContent = d.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
    $('data').textContent = `${dias[d.getDay()]}, ${d.getDate()} ${meses[d.getMonth()]}`;
    const h = d.getHours();
    $('saudacao').textContent = (h < 5 ? 'Boa noite' : h < 12 ? 'Bom dia' : h < 18 ? 'Boa tarde' : 'Boa noite') + ', patrão';
  }
  tic(); setInterval(tic, 1000);

  // ── rede ──
  const rede = () => $('rede').classList.toggle('off', !navigator.onLine);
  addEventListener('online', rede); addEventListener('offline', rede); rede();

  // ── dados do painel (clima, cidade, agenda) ──
  let pos = { lat: null, lon: null };
  const token = () => (nativo && nativo.token ? nativo.token() : params.get('t') || '');
  async function carregarPainel() {
    try {
      const q = pos.lat ? `?lat=${pos.lat}&lon=${pos.lon}` : '';
      const r = await fetch(`/carro/painel${q}`, { headers: { Authorization: 'Bearer ' + token() } });
      if (!r.ok) throw new Error(r.status);
      const p = await r.json();
      $('cidade-topo').textContent = p.cidade;
      if (p.sol) { sol = { nasce: Date.parse(p.sol.nasce + ':00-03:00'), poe: Date.parse(p.sol.poe + ':00-03:00') }; noite(); }
      if (p.clima) {
        $('temp-topo').textContent = p.clima.agora + '°';
        $('clima').innerHTML = `<b>${p.cidade}</b> · ${p.clima.agora}°C · ${p.clima.texto}<br>máx ${p.clima.max}° · chuva ${p.clima.chuva}%`;
      }
      const ag = $('agenda'); ag.textContent = '';
      if (!p.agenda.length) { const v = document.createElement('div'); v.className = 'vazio'; v.textContent = 'Nada marcado. Dia livre.'; ag.appendChild(v); }
      p.agenda.slice(0, 4).forEach((i) => {
        const l = document.createElement('div'); l.className = 'item';
        const hh = document.createElement('span'); hh.className = 'hh' + (i.hora === 'Dia todo' ? ' dia' : ''); hh.textContent = i.hora;
        const tt = document.createElement('span'); tt.className = 'tt'; tt.textContent = i.titulo;
        l.append(hh, tt); ag.appendChild(l);
      });
    } catch (e) {
      $('clima').textContent = 'Sem conexão agora.';
      diag('painel', 'não carregou clima/agenda: ' + e.message, { online: navigator.onLine });
    }
  }
  carregarPainel(); setInterval(carregarPainel, 10 * 60 * 1000);

  // ── modo noite: escurece do pôr ao nascer do sol (sem o dado do sol, das 18h às 6h) ──
  let sol = null;
  function noite() {
    const agora = Date.now(), h = new Date().getHours();
    const escuro = params.get('noite') ? params.get('noite') === '1'
      : sol ? (agora > sol.poe + 20 * 60000 || agora < sol.nasce - 20 * 60000) : (h >= 18 || h < 6);
    palco.classList.toggle('noite', escuro);
  }
  noite(); setInterval(noite, 60 * 1000);

  // ── carro girando: folha de quadros + arraste com inércia ──
  const giro = $('giro');
  const G = { n: 48, cols: 8, w: 548, h: 288 };   // 48 ângulos já no tamanho da tela: ~28 MB de RAM em vez de ~83   // folha com o carro recortado e alinhado pelas rodas
  const esc = 1;
  const POSE = 7;                          // quadro de partida: 3/4 de frente (a pose do render)
  const VOLTA_POSE_MS = 10000;             // soltou e ficou 10 s sem mexer: volta devagar pra pose
  const giro2 = $('giro2'), refl1 = $('refl1'), refl2 = $('refl2'), foto = $('foto');
  let fotoPronta = false;
  foto.addEventListener('load', () => { fotoPronta = true; desenhar(); });
  let quadro = Number(params.get('quadro')) || POSE, vel = 0, alvo = null, arrastando = false, ultimoX = 0, ultimoT = 0, temGiro = false, soltouEm = 0;
  const img = new Image();
  img.onload = () => {
    temGiro = true;
    for (const el of [giro, giro2, refl1, refl2]) {
      el.style.backgroundImage = 'url(hb20_giro_48.webp)';
      el.style.backgroundSize = `${G.cols * G.w * esc}px ${Math.ceil(G.n / G.cols) * G.h * esc}px`;
    }
    desenhar();
  };
  img.onerror = () => {  // sem a folha: mostra o render parado
    giro.style.backgroundImage = 'url(carro_frente.webp)';
    giro.style.backgroundSize = 'cover'; giro.style.backgroundPosition = 'center';
    $('dica').style.opacity = 0;
  };
  img.src = 'hb20_giro_48.webp';
  function posicao(k) {
    k = ((k % G.n) + G.n) % G.n;
    return `${-(k % G.cols) * G.w * esc}px ${-Math.floor(k / G.cols) * G.h * esc}px`;
  }
  function desenhar() {
    if (!temGiro) return;
    // um quadro inteiro por vez: misturar dois quadros do carro recortado deixa ele "fantasma"
    const k = Math.round(quadro);
    giro.style.backgroundPosition = refl1.style.backgroundPosition = posicao(k);
    giro2.style.opacity = refl2.style.opacity = '0';
    // parado na pose: foto nítida em alta por cima; mexeu, volta o giro
    const naPose = !arrastando && alvo === null && Math.abs(vel) <= 0.02 && ((k % G.n) + G.n) % G.n === POSE;
    foto.style.opacity = naPose && fotoPronta ? '1' : '0';
    giro.style.opacity = naPose && fotoPronta ? '0' : '1';   // sem contorno duplo por baixo da foto
  }
  function animarGiro() {
    if (!arrastando && temGiro) {
      if (alvo !== null) {                 // volta de abertura: desacelera até a pose
        const falta = alvo - quadro;
        quadro += Math.sign(falta) * Math.max(0.15, Math.abs(falta) * 0.045);
        if (Math.abs(falta) < 0.2) { quadro = alvo; alvo = null; vel = 0; }
        desenhar();
      } else if (Math.abs(vel) > 0.02) {   // soltou o dedo: embala um pouco e para
        quadro += vel; vel *= 0.9;
        if (Math.abs(vel) <= 0.02) vel = 0;
        desenhar();
      } else if (soltouEm && Date.now() - soltouEm > VOLTA_POSE_MS) {
        // parado há um tempo fora da pose: volta pelo caminho mais curto
        const volta = ((POSE - quadro) % G.n + G.n * 1.5) % G.n - G.n / 2;
        if (Math.abs(volta) > 0.5) alvo = quadro + volta;
        soltouEm = 0;
      }
    }
    requestAnimationFrame(animarGiro);
  }
  requestAnimationFrame(animarGiro);
  const carro = $('carro');
  carro.addEventListener('pointerdown', (e) => {
    arrastando = true; ultimoX = e.clientX; ultimoT = performance.now(); vel = 0;
    carro.setPointerCapture(e.pointerId); $('dica').style.opacity = 0;
  });
  carro.addEventListener('pointermove', (e) => {
    if (!arrastando) return;
    const esc2 = parseFloat(palco.style.transform.replace(/[^\d.]/g, '')) || 1;
    const dx = (e.clientX - ultimoX) / esc2, agora = performance.now();
    quadro += dx / 10;                    // 10 px de dedo = 1 quadro (7,5°), no mesmo sentido do dedo
    vel = dx / 10 / Math.max(1, (agora - ultimoT) / 16);
    ultimoX = e.clientX; ultimoT = agora; desenhar();
  });
  const soltar = () => { arrastando = false; soltouEm = Date.now(); desenhar(); };
  carro.addEventListener('pointerup', soltar); carro.addEventListener('pointercancel', soltar);

  // ── onda de voz ──
  const barras = [];
  for (const lado of ['onda-e', 'onda-d']) for (let i = 0; i < 34; i++) {
    const b = document.createElement('i'); $(lado).appendChild(b); barras.push(b);
  }
  let nivel = 0, estadoAtual = 'pronto';
  let ondaParada = false;
  function animarOnda(t) {
    const ativa = estadoAtual === 'ouvindo' || estadoAtual === 'falando' || nivel > 0.02;
    if (!ativa) {
      if (!ondaParada) { barras.forEach((b) => { b.style.height = '3px'; }); ondaParada = true; }
      requestAnimationFrame(animarOnda);
      return;
    }
    ondaParada = false;
    barras.forEach((b, i) => {
      const meio = i < 34 ? i / 33 : 1 - (i - 34) / 33;   // mais alto perto da bolinha
      const ruido = Math.sin(t / 120 + i * 1.7) * 0.5 + 0.5;
      const base = estadoAtual === 'ouvindo' || estadoAtual === 'falando' ? 0.15 : 0.04;
      b.style.height = (3 + 17 * Math.min(1, (base + nivel) * meio * (0.4 + ruido))) + 'px';
    });
    nivel *= 0.92;
    requestAnimationFrame(animarOnda);
  }
  requestAnimationFrame(animarOnda);

  // ── estados da bolinha ──
  const ESTADOS = {
    pronto:   { cor: '#22D3EE', halo: 'rgba(34,211,238,.28)', rotulo: 'Pronto' },
    ouvindo:  { cor: '#22D3EE', halo: 'rgba(34,211,238,.45)', rotulo: 'Ouvindo…' },
    pensando: { cor: '#A78BFA', halo: 'rgba(167,139,250,.45)', rotulo: 'Pensando…' },
    falando:  { cor: '#22D3EE', halo: 'rgba(34,211,238,.45)', rotulo: 'Jake' },
    feito:    { cor: '#34D399', halo: 'rgba(52,211,153,.45)', rotulo: 'Feito' },
    offline:  { cor: '#FBBF24', halo: 'rgba(251,191,36,.45)', rotulo: 'Sem internet' },
  };
  function estado(nome, frase) {
    const e = ESTADOS[nome] || ESTADOS.pronto; estadoAtual = nome;
    palco.style.setProperty('--cor', e.cor); palco.style.setProperty('--halo', e.halo);
    $('estado').textContent = e.rotulo;
    if (frase !== undefined && frase !== null) $('frase').textContent = frase;
  }

  // ── velocidade e modo ──
  let kmhAtual = 0, desde = Date.now(), modo = 'parado';
  function gps(kmh, lat, lon) {
    kmhAtual = Math.max(0, Math.round(kmh || 0));
    if (lat) { const mudou = !pos.lat || Math.abs(pos.lat - lat) > 0.05; pos = { lat, lon }; if (mudou) carregarPainel(); mapaPosicao(lat, lon); }
    $('kmh').textContent = kmhAtual;
    const acesos = Math.round(Math.min(1, kmhAtual / 140) * segmentos.length);
    segmentos.forEach((g, i) => { g.classList.toggle('on', i < acesos); g.classList.toggle('alta', i >= segmentos.length * 0.78); });
    computadorDeBordo(kmhAtual, lat, lon);
    const quer = kmhAtual >= 12 ? 'andando' : kmhAtual <= 4 ? 'parado' : modo;
    if (quer !== modo) {
      if (Date.now() - desde > (quer === 'andando' ? 4000 : 10000)) mudarModo(quer);
    } else desde = Date.now();
  }
  function mudarModo(m) {
    modo = m; desde = Date.now();
    palco.classList.toggle('andando', m === 'andando'); palco.classList.toggle('parado', m === 'parado');
    if (mapa) setTimeout(() => { mapa.invalidateSize(); if (m === 'andando') mapa.setView(eu.getLatLng(), 16); }, 750);
  }

  // barra de velocidade (0 a 140 km/h; o último quarto fica âmbar)
  const segmentos = [];
  for (let i = 0; i < 28; i++) { const g = document.createElement('i'); $('barra').appendChild(g); segmentos.push(g); }

  // computador de bordo: tempo, km, média e máxima da viagem (zera depois de 20 min parado)
  const viagem = { inicio: 0, km: 0, emMovimento: 0, max: 0, ultimo: null, ultimoT: 0, andouEm: 0 };
  function distanciaKm(a, b) {
    const r = Math.PI / 180, dLat = (b.lat - a.lat) * r, dLon = (b.lon - a.lon) * r;
    const h = Math.sin(dLat / 2) ** 2 + Math.cos(a.lat * r) * Math.cos(b.lat * r) * Math.sin(dLon / 2) ** 2;
    return 12742 * Math.asin(Math.sqrt(h));
  }
  function computadorDeBordo(kmh, lat, lon) {
    const agora = Date.now();
    if (viagem.andouEm && agora - viagem.andouEm > 20 * 60000) Object.assign(viagem, { inicio: 0, km: 0, emMovimento: 0, max: 0 });
    if (kmh > 3) { if (!viagem.inicio) viagem.inicio = agora; viagem.andouEm = agora; viagem.max = Math.max(viagem.max, kmh); }
    if (lat) {
      const aqui = { lat, lon };
      if (viagem.ultimo && agora - viagem.ultimoT < 30000 && kmh > 3) {
        const d = distanciaKm(viagem.ultimo, aqui);
        if (d < 1) { viagem.km += d; viagem.emMovimento += (agora - viagem.ultimoT) / 1000; }   // ignora saltos da posição pela rede
      }
      viagem.ultimo = aqui; viagem.ultimoT = agora;
    }
    const min = viagem.inicio ? Math.floor((agora - viagem.inicio) / 60000) : 0;
    $('v-tempo').textContent = `${Math.floor(min / 60)}:${String(min % 60).padStart(2, '0')}`;
    $('v-km').textContent = viagem.km.toFixed(1).replace('.', ',');
    $('v-media').textContent = viagem.emMovimento > 30 ? Math.round(viagem.km / (viagem.emMovimento / 3600)) : 0;
    $('v-max').textContent = viagem.max;
  }

  // ── estrada andando (só no modo andando) ──
  const cv = $('estrada'), cx = cv.getContext('2d');
  let fase = 0;
  // A estrada segue a direção do carro (3/4 traseiro, apontando pra direita e pro fundo): as linhas fogem pro
  // horizonte à direita, passam por baixo do carro e as marcações vêm do fundo em direção à câmera.
  const FUGA = { x: 1010, y: 300 };            // ponto de fuga, alinhado com o eixo do carro
  const CENTRO_PISTA = -27;                     // onde o eixo do carro cruza a borda de baixo da tela
  const LINHAS = [-1040, -780, -520, -260, 0, 260, 520, 780].map((d) => CENTRO_PISTA + d);
  function estrada() {
    if (modo === 'andando') {
      cx.clearRect(0, 0, 1024, 600);
      fase = (fase + 0.004 + kmhAtual / 9000) % 1;
      const ponto = (xb, t) => [FUGA.x + (xb - FUGA.x) * t, FUGA.y + (600 - FUGA.y) * t];
      LINHAS.forEach((xb) => {
        const pista = Math.abs(xb - CENTRO_PISTA) === 260;          // as duas bordas da pista do carro
        // trilho contínuo e fraco (dá a direção da estrada)
        const [a0, b0] = ponto(xb, 0.02), [a1, b1] = ponto(xb, 1.15);
        const g = cx.createLinearGradient(a0, b0, a1, b1);
        g.addColorStop(0, 'rgba(34,211,238,0)');
        g.addColorStop(1, `rgba(34,211,238,${pista ? 0.35 : 0.12})`);
        cx.strokeStyle = g; cx.lineWidth = pista ? 2 : 1;
        cx.beginPath(); cx.moveTo(a0, b0); cx.lineTo(a1, b1); cx.stroke();
        // marcações andando do fundo pra câmera (perspectiva: crescem perto)
        for (let k = 0; k < 8; k++) {
          const u = (k / 8 + fase) % 1, t0 = u * u * 1.15, t1 = Math.min(1.2, t0 + 0.035 + 0.06 * u);
          const [x0, y0] = ponto(xb, t0), [x1, y1] = ponto(xb, t1);
          cx.strokeStyle = `rgba(34,211,238,${0.06 + 0.55 * u * (pista ? 1.3 : 0.5)})`;
          cx.lineWidth = 1 + 3.5 * u;
          cx.beginPath(); cx.moveTo(x0, y0); cx.lineTo(x1, y1); cx.stroke();
        }
      });
      // brilho no horizonte, onde a estrada some
      const h = cx.createRadialGradient(FUGA.x, FUGA.y, 0, FUGA.x, FUGA.y, 220);
      h.addColorStop(0, 'rgba(34,211,238,.18)'); h.addColorStop(1, 'rgba(34,211,238,0)');
      cx.fillStyle = h; cx.fillRect(FUGA.x - 220, FUGA.y - 220, 440, 440);
    }
    requestAnimationFrame(estrada);
  }
  requestAnimationFrame(estrada);

  // ── próxima curva lida da notificação do Maps ──
  const SETAS = {
    direita:  'M30 90V45h40M58 30l14 15-14 15',
    esquerda: 'M70 90V45H30M42 30 28 45l14 15',
    frente:   'M50 92V12M34 28 50 12l16 16',
    retorno:  'M66 92V40a16 16 0 0 0-32 0v18M22 46l12 14 12-14',
    rotatoria:'M50 92V66M50 66a16 16 0 1 1 16-16M58 26l8 24-24-2',
  };
  function navegacao(d) {
    const rota = $('rota');
    if (!d) { rota.classList.remove('nav'); return; }
    const partes = [d.titulo, d.texto, d.sub].filter(Boolean);
    const reDist = /(\d+(?:[.,]\d+)?\s?(?:km|m))\b/i;
    let dist = '', instr = '';
    for (const p of partes) { const m = p.match(reDist); if (m && !dist) { dist = m[1]; if (p.replace(m[0], '').trim().length > 3) instr = p.replace(m[0], '').replace(/^[\s·,-]+|[\s·,-]+$/g, ''); } }
    if (!instr) instr = partes.find((p) => !reDist.test(p)) || partes[0] || '';
    const tudo = partes.join(' ').toLowerCase();
    const tipo = /retorno|meia-volta/.test(tudo) ? 'retorno' : /rotat/.test(tudo) ? 'rotatoria'
      : /direita/.test(tudo) ? 'direita' : /esquerda/.test(tudo) ? 'esquerda' : 'frente';
    $('seta-p').setAttribute('d', SETAS[tipo]);
    $('dist').textContent = dist;
    $('instr').textContent = instr;
    const cheg = partes.find((p) => /\d{1,2}:\d{2}/.test(p) && p !== instr);
    if (cheg) $('chegada').textContent = cheg;
    rota.classList.add('nav');
  }

  // ── toques ──
  // tocar na bolinha: conversa em tempo real; se não der (sem sinal etc.), cai no esquema antigo do app
  async function falar() {
    if (window.JakeTempoReal && JakeTempoReal.ativo()) { JakeTempoReal.encerrar(); return; }
    const ok = window.JakeTempoReal && await JakeTempoReal.conversar({
      estado, nivel: (v) => { nivel = Math.max(nivel, Math.min(1, v)); }, token, nativo,
      destino: (d) => { $('destino').textContent = d || 'Rodando livre'; mapaRota(d); } });
    if (!ok) { if (nativo && nativo.falar) nativo.falar(); else demo(); }
  }
  $('orbe').addEventListener('click', falar);
  $('p-viagem').addEventListener('click', () => nativo && nativo.perguntar
    ? nativo.ouvirCom('Pra onde vamos, patrão?') : demo());
  $('p-resumo').addEventListener('click', () => nativo && nativo.perguntar
    ? nativo.perguntar('Me dá um resumo do meu dia: o que tenho hoje e amanhã na agenda.') : demo());

  document.querySelectorAll('[data-app]').forEach((b) => b.addEventListener('click', () => {
    if (nativo && nativo.abrirApp) nativo.abrirApp(b.dataset.app); else demo();
  }));

  // ── prévia no navegador (sem o app): passeia pelos estados ──
  function demo() {
    const seq = [['ouvindo', '“Jake, coloca no mapa São Tomé das Letras”'], ['pensando', 'Só um segundo, patrão.'],
      ['feito', 'Rota pra São Tomé das Letras no Maps.'], ['pronto', 'Toque em mim ou diga “Jake”.']];
    seq.forEach(([n, f], i) => setTimeout(() => { estado(n, f); if (n === 'ouvindo') nivel = 0.8; }, i * 1600));
  }
  if (!nativo) {
    musica({ titulo: 'Exemplo de música', artista: 'Froid', tocando: true });
    setTimeout(() => mapaRota('São Tomé das Letras, MG'), 1500);
  }
  // prévia no computador: clicar no logo simula "ligou o carro" (som + clarão); tecla A alterna parado/andando
  if (!nativo) {
    $('marca').style.cursor = 'pointer';
    $('marca').addEventListener('click', acordar);
    addEventListener('keydown', (e) => {
      if (e.key === 'a' || e.key === 'A') {
        if (modo === 'parado') { mudarModo('andando'); gps(62); $('destino').textContent = 'São Tomé das Letras';
          navegacao({ titulo: 'Vire à direita na Av. Rio Branco', texto: '400 m', sub: 'Chegada 16:31 · 87 km' }); }
        else { mudarModo('parado'); kmhAtual = 0; }
      }
    });
  }
  if (params.get('autofalar')) setTimeout(falar, 1500);   // só pra teste automático

  // ── ligou o carro: som da nave + tela acendendo do centro ──
  const somAbertura = new Audio('sons/abertura_B_nave.mp3');
  somAbertura.preload = 'auto';
  function acordar() {
    palco.classList.add('acordando');
    void palco.offsetWidth;                 // reinicia a animação do clarão
    setTimeout(() => palco.classList.remove('acordando'), 350);
    quadro = POSE - G.n; vel = 0; alvo = POSE;   // uma volta completa, desacelerando até a pose
    estado('pronto', 'Sistemas online.');
    if (!(nativo && nativo.falarAudio)) { somAbertura.currentTime = 0; somAbertura.play().catch(() => {}); }
  }

  // ── mini mapa (OpenStreetMap/CARTO escuro, tingido de ciano) ──
  let mapa = null, eu = null, linhaRota = null, navegando = false;
  const VARGINHA = [-21.5513, -45.4303];
  if (window.L) {
    mapa = L.map('mapa', { zoomControl: false, dragging: false, scrollWheelZoom: false, doubleClickZoom: false,
      boxZoom: false, keyboard: false, touchZoom: false, attributionControl: true }).setView(VARGINHA, 15);
    mapa.attributionControl.setPrefix('');
    // Esri "Dark Gray" (grátis, sem chave), tingido de ciano pelo CSS
    L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Dark_Gray_Base/MapServer/tile/{z}/{y}/{x}', {
      maxZoom: 16, attribution: '© Esri' }).addTo(mapa);
    eu = L.marker(VARGINHA, { icon: L.divIcon({ className: '', html: '<div class="eu"></div>', iconSize: [16, 16] }) }).addTo(mapa);
  }
  function mapaPosicao(lat, lon) {
    if (!mapa) return;
    eu.setLatLng([lat, lon]);
    if (modo === 'andando') mapa.setView([lat, lon], Math.max(mapa.getZoom(), 15), { animate: true });   // segue o carro
    else if (!navegando) mapa.panTo([lat, lon], { animate: true });
  }
  async function mapaRota(destinoTxt) {
    if (!mapa) return;
    if (linhaRota) { linhaRota.remove(); linhaRota = null; }
    if (!destinoTxt) { navegando = false; $('mapa-info').textContent = 'Você está aqui'; mapa.setView(eu.getLatLng(), 15); return; }
    try {
      const o = eu.getLatLng();
      const r = await fetch(`/carro/rota?lat=${o.lat}&lon=${o.lng}&para=${encodeURIComponent(destinoTxt)}`,
        { headers: { Authorization: 'Bearer ' + token() } });
      const d = await r.json();
      if (!d.pontos) throw new Error('sem rota');
      linhaRota = L.polyline(d.pontos, { color: '#22D3EE', weight: 4, opacity: .95 }).addTo(mapa);
      navegando = true;
      mapa.fitBounds(linhaRota.getBounds(), { padding: [18, 30] });
      $('mapa-info').textContent = `${destinoTxt} · ${d.km} km · ${d.tempo}`;
    } catch (e) { $('mapa-info').textContent = destinoTxt; }
  }
  $('mapa-card').addEventListener('click', () => (nativo && nativo.abrirApp ? nativo.abrirApp('mapa') : demo()));

  // ── mini player ──
  function musica(m) {
    const capa = $('capa');
    if (!m || !m.titulo) {
      $('musica-tit').textContent = 'Nada tocando'; $('musica-art').textContent = 'Toque pra abrir o Spotify';
      capa.style.backgroundImage = ''; capa.firstElementChild && (capa.firstElementChild.style.display = '');
      $('icone-play').innerHTML = '<path d="M8 5v14l11-7z"/>'; return;
    }
    $('musica-tit').textContent = m.titulo; $('musica-art').textContent = m.artista || '';
    if (m.capa) { capa.style.backgroundImage = `url(${m.capa})`; capa.firstElementChild.style.display = 'none'; }
    $('icone-play').innerHTML = m.tocando ? '<path d="M7 5h4v14H7zM13 5h4v14h-4z"/>' : '<path d="M8 5v14l11-7z"/>';
  }
  $('musica-txt').addEventListener('click', () => (nativo && nativo.abrirApp ? nativo.abrirApp('musica') : demo()));
  document.querySelectorAll('[data-midia]').forEach((b) => b.addEventListener('click', (e) => {
    e.stopPropagation();
    if (nativo && nativo.midia) nativo.midia(b.dataset.midia); else demo();
  }));

  // ── avisos que o Jake dá sozinho (compromisso, saldo, chuva) ──
  async function buscarAviso() {
    if (!navigator.onLine || (window.JakeTempoReal && JakeTempoReal.ativo()) || estadoAtual !== 'pronto') return;
    try {
      const q = pos.lat ? `?lat=${pos.lat}&lon=${pos.lon}` : '';
      const r = await fetch(`/carro/avisos${q}`, { headers: { Authorization: 'Bearer ' + token() } });
      const { aviso } = await r.json();
      if (!aviso || estadoAtual !== 'pronto') return;
      if (nativo && nativo.falarAudio) { nativo.falarAudio(aviso.texto, aviso.audio_b64); return; }   // o app fala (só abaixa a música)
      nativo && nativo.foco && nativo.foco(true);
      estado('falando', aviso.texto);
      const som = new Audio('data:audio/mpeg;base64,' + aviso.audio_b64);
      const fim = () => { estado('pronto', aviso.texto); nativo && nativo.foco && nativo.foco(false); };
      som.onended = fim; som.onerror = fim;
      som.play().catch(fim);
    } catch (e) {}
  }
  if (nativo || params.get('avisos')) { setTimeout(buscarAviso, 45000); setInterval(buscarAviso, 2 * 60 * 1000); }

  // ── o que o app chama ──
  // prévia no navegador: ?modo=andando (fica no fim: precisa do mapa e do computador de bordo já criados)
  if (params.get('modo') === 'andando') {
    mudarModo('andando'); kmhAtual = 62; gps(62);
    $('destino').textContent = 'São Tomé das Letras';
    navegacao({ titulo: 'Vire à direita na Av. Rio Branco', texto: '400 m', sub: 'Chegada 16:31 · 87 km' });
    Object.assign(viagem, { inicio: Date.now() - 23 * 60000, km: 18.4, emMovimento: 1250, max: 87 }); computadorDeBordo(62);
  }

  window.jake = {
    estado, gps,
    nivel: (v) => { nivel = Math.max(nivel, Math.min(1, v)); },
    destino: (nome, chegada) => { $('destino').textContent = nome || 'Rodando livre'; $('chegada').textContent = chegada || ''; mapaRota(nome); },
    musica,
    painel: carregarPainel,
    conversar: falar,
    acordar,
    navegacao,
  };
  estado('pronto');
})();
</script>
</body>
</html>
